[defaults]
deprecation_warnings = False
inventory = hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
pipelining = True
forks = 10
stdout_callback = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
