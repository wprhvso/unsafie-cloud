---
- name: setup common backup infrastructure and runner
  hosts: mesh
  become: true
  roles:
    - backup_common

- name: configure backups for postgresql and platform core database
  hosts: mesh[0]
  become: true
  roles:
    - walg
    - backup_platform_db

- name: configure backups for analytical and document databases
  hosts: mesh
  become: true
  roles:
    - backup_clickhouse
    - backup_mongo

- name: configure backups for in-memory and messaging brokers
  hosts: mesh
  become: true
  roles:
    - backup_valkey
    - backup_redpanda
    - backup_rabbitmq
    - backup_nats
