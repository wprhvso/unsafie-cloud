---
- name: execute automated disaster recovery drill and db verification
  hosts: mesh
  become: true
  tasks:
    - name: verify postgresql readiness
      ansible.builtin.command:
        cmd: "/usr/lib/postgresql/17/bin/pg_isready -h 127.0.0.1 -p 5432"
      register: pg_drill
      failed_when: false

    - name: verify valkey responsiveness
      ansible.builtin.command:
        cmd: "valkey-cli ping"
      register: valkey_drill
      failed_when: false

    - name: verify clickhouse responsiveness
      ansible.builtin.command:
        cmd: "clickhouse-client -q 'SELECT 1;'"
      register: ch_drill
      failed_when: false

    - name: verify mongodb status
      ansible.builtin.systemd:
        name: mongod
      register: mongo_drill
      failed_when: false

    - name: verify redpanda status
      ansible.builtin.systemd:
        name: redpanda
      register: redpanda_drill
      failed_when: false

    - name: verify rabbitmq status
      ansible.builtin.command:
        cmd: "rabbitmqctl status"
      register: rabbit_drill
      failed_when: false

    - name: verify qdrant health
      ansible.builtin.uri:
        url: "http://127.0.0.1:6333/collections"
        method: GET
        status_code: 200
      register: qdrant_drill
      failed_when: false

    - name: verify meilisearch health
      ansible.builtin.uri:
        url: "http://127.0.0.1:7700/health"
        method: GET
        status_code: 200
      register: meili_drill
      failed_when: false

    - name: verify pocketbase health
      ansible.builtin.uri:
        url: "http://127.0.0.1:8090/api/health"
        method: GET
        status_code: 200
      register: pb_drill
      failed_when: false

    - name: ensure textfile collector directory exists
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile_collector
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: write disaster recovery drill metrics
      ansible.builtin.copy:
        dest: /var/lib/node_exporter/textfile_collector/backup_dr_drill.prom
        mode: "0644"
        content: |
          infra_dr_drill_success{db="postgres",host="{{ inventory_hostname }}"} {{ 1 if pg_drill.rc == 0 else 0 }}
          infra_dr_drill_success{db="valkey",host="{{ inventory_hostname }}"} {{ 1 if valkey_drill.rc == 0 else 0 }}
          infra_dr_drill_success{db="clickhouse",host="{{ inventory_hostname }}"} {{ 1 if ch_drill.rc == 0 else 0 }}
          infra_dr_drill_success{db="mongo",host="{{ inventory_hostname }}"} {{ 1 if (mongo_drill.status is defined and mongo_drill.status.ActiveState == 'active') else 0 }}
          infra_dr_drill_success{db="redpanda",host="{{ inventory_hostname }}"} {{ 1 if (redpanda_drill.status is defined and redpanda_drill.status.ActiveState == 'active') else 0 }}
          infra_dr_drill_success{db="rabbitmq",host="{{ inventory_hostname }}"} {{ 1 if rabbit_drill.rc == 0 else 0 }}
          infra_dr_drill_success{db="qdrant",host="{{ inventory_hostname }}"} {{ 1 if (qdrant_drill.status is defined and qdrant_drill.status == 200) else 0 }}
          infra_dr_drill_success{db="meilisearch",host="{{ inventory_hostname }}"} {{ 1 if (meili_drill.status is defined and meili_drill.status == 200) else 0 }}
          infra_dr_drill_success{db="pocketbase",host="{{ inventory_hostname }}"} {{ 1 if (pb_drill.status is defined and pb_drill.status == 200) else 0 }}
          infra_dr_drill_last_timestamp{host="{{ inventory_hostname }}"} {{ ansible_date_time.epoch }}
