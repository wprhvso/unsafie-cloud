---
- name: restore rabbitmq definitions from s3
  hosts: "{{ target_host | default('all') }}"
  become: true
  vars:
    tmp_dir: "/tmp/restore_rabbitmq_{{ ansible_date_time.epoch }}"
  tasks:
    - name: create temporary directory
      ansible.builtin.file:
        path: "{{ tmp_dir }}"
        state: directory
        mode: "0750"

    - name: download rabbitmq archive from s3
      ansible.builtin.command:
        cmd: "/usr/local/bin/infra-s3-client download {{ s3_archive_key }} {{ tmp_dir }}/rabbit.tar.zst"

    - name: unarchive rabbitmq data
      ansible.builtin.shell:
        cmd: "tar -I zstd -xf {{ tmp_dir }}/rabbit.tar.zst -C {{ tmp_dir }}"

    - name: import rabbitmq definitions
      ansible.builtin.command:
        cmd: "rabbitmqctl import_definitions {{ tmp_dir }}/definitions.json"
      when: lookup('file', tmp_dir + '/definitions.json', errors='ignore') != ''
      ignore_errors: true

    - name: clean up temporary directory
      ansible.builtin.file:
        path: "{{ tmp_dir }}"
        state: absent
