---
- name: restore platform core database from s3
  hosts: "{{ target_host | default('mesh[0]') }}"
  become: true
  vars:
    platform_db_name: "infra_platform"
    tmp_archive: "/tmp/restore_platform_db_{{ ansible_date_time.epoch }}"
  tasks:
    - name: download platform database archive from s3
      ansible.builtin.command:
        cmd: "/usr/local/bin/infra-s3-client download {{ s3_archive_key }} {{ tmp_archive }}.raw"

    - name: decrypt archive if key is provided
      ansible.builtin.shell:
        cmd: "openssl enc -d -aes-256-gcm -pbkdf2 -pass 'pass:{{ vault_backup_encryption_key }}' -in {{ tmp_archive }}.raw -out {{ tmp_archive }}.sql.zst"
      when: vault_backup_encryption_key is defined and vault_backup_encryption_key != ""

    - name: copy raw archive if not encrypted
      ansible.builtin.copy:
        src: "{{ tmp_archive }}.raw"
        dest: "{{ tmp_archive }}.sql.zst"
        remote_src: true
      when: vault_backup_encryption_key is not defined or vault_backup_encryption_key == ""

    - name: import database dump into postgresql
      ansible.builtin.shell:
        cmd: "zstd -d -c {{ tmp_archive }}.sql.zst | psql -U postgres -d {{ platform_db_name }}"

    - name: clean up temporary files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ tmp_archive }}.raw"
        - "{{ tmp_archive }}.sql.zst"
