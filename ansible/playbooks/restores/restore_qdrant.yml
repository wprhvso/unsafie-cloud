---
- name: restore qdrant collection from s3 snapshot
  hosts: "{{ target_host | default('all') }}"
  become: true
  vars:
    tmp_snapshot: "/tmp/restore_qdrant_{{ ansible_date_time.epoch }}.snapshot"
    qdrant_port: 6333
  tasks:
    - name: download qdrant snapshot from s3
      ansible.builtin.command:
        cmd: "/usr/local/bin/infra-s3-client download {{ s3_archive_key }} {{ tmp_snapshot }}"

    - name: recover collection from snapshot
      ansible.builtin.command:
        cmd: >
          curl -sf -X POST "http://127.0.0.1:{{ qdrant_port }}/collections/{{ collection_name }}/snapshots/recover"
          -H "Content-Type: multipart/form-data"
          -F "snapshot=@{{ tmp_snapshot }}"

    - name: clean up temporary snapshot file
      ansible.builtin.file:
        path: "{{ tmp_snapshot }}"
        state: absent
