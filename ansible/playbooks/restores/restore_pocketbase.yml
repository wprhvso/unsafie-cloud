---
- name: restore pocketbase from s3 backup
  hosts: "{{ target_host | default('all') }}"
  become: true
  vars:
    pb_data_dir: "/var/lib/pocketbase/pb_data"
    tmp_archive: "/tmp/restore_pb_{{ ansible_date_time.epoch }}.tar.zst"
  tasks:
    - name: stop pocketbase service
      ansible.builtin.systemd:
        name: pocketbase
        state: stopped

    - name: backup existing pocketbase data directory
      ansible.builtin.command:
        cmd: "mv {{ pb_data_dir }} {{ pb_data_dir }}.bak.{{ ansible_date_time.epoch }}"
      failed_when: false

    - name: ensure pocketbase data directory exists
      ansible.builtin.file:
        path: "{{ pb_data_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: download pocketbase archive from s3
      ansible.builtin.command:
        cmd: "/usr/local/bin/infra-s3-client download {{ s3_archive_key }} {{ tmp_archive }}"

    - name: unpack pocketbase backup archive
      ansible.builtin.shell:
        cmd: "tar -I zstd -xf {{ tmp_archive }} -C {{ pb_data_dir }}"

    - name: check sqlite database integrity
      ansible.builtin.command:
        cmd: "sqlite3 {{ pb_data_dir }}/data.db 'PRAGMA integrity_check;'"
      register: sqlite_check
      failed_when: sqlite_check.stdout != 'ok'
      when: lookup('file', pb_data_dir + '/data.db', errors='ignore') is not none

    - name: clean up temporary archive
      ansible.builtin.file:
        path: "{{ tmp_archive }}"
        state: absent

    - name: start pocketbase service
      ansible.builtin.systemd:
        name: pocketbase
        state: started
