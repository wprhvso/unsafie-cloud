---
- name: restore nats jetstream from s3
  hosts: "{{ target_host | default('all') }}"
  become: true
  vars:
    tmp_dir: "/tmp/restore_nats_{{ ansible_date_time.epoch }}"
  tasks:
    - name: create temporary extraction directory
      ansible.builtin.file:
        path: "{{ tmp_dir }}"
        state: directory
        mode: "0750"

    - name: download nats archive from s3
      ansible.builtin.command:
        cmd: "/usr/local/bin/infra-s3-client download {{ s3_archive_key }} {{ tmp_dir }}/nats.tar.zst"

    - name: unarchive nats data
      ansible.builtin.shell:
        cmd: "tar -I zstd -xf {{ tmp_dir }}/nats.tar.zst -C {{ tmp_dir }}"

    - name: restore jetstream directory
      ansible.builtin.copy:
        src: "{{ tmp_dir }}/jetstream/"
        dest: /var/lib/nats/jetstream/
        remote_src: true
      when: lookup('file', tmp_dir + '/jetstream', errors='ignore') is not none
      ignore_errors: true

    - name: clean up temporary directory
      ansible.builtin.file:
        path: "{{ tmp_dir }}"
        state: absent
