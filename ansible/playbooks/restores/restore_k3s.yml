---
- name: restore k3s etcd cluster from s3 snapshot
  hosts: "{{ target_host | default('mesh[0]') }}"
  become: true
  vars:
    s3_endpoint: "{{ backup_s3_endpoint | regex_replace('^https?://', '') }}"
  tasks:
    - name: stop k3s service on target host
      ansible.builtin.systemd:
        name: k3s
        state: stopped

    - name: reset cluster and restore from external s3 snapshot
      ansible.builtin.command:
        cmd: >
          k3s server --cluster-reset
          --from-external-snapshot=s3://{{ backup_s3_bucket }}/k3s-etcd/{{ snapshot_name }}
          --etcd-s3-endpoint={{ s3_endpoint }}

    - name: start k3s service
      ansible.builtin.systemd:
        name: k3s
        state: started

    - name: wait for k3s nodes to report ready
      ansible.builtin.command:
        cmd: "kubectl get nodes"
      register: nodes_check
      retries: 20
      delay: 3
      until: nodes_check.rc == 0
