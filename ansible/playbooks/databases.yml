---
- name: deploy native systemd databases via official apt repositories
  hosts: all
  become: true
  roles:
    - role: db_apt_common
      tags: [apt, common]
    - role: db_postgres
      tags: [postgres]
    - role: db_valkey
      tags: [valkey, redis]
    - role: db_mongo
      tags: [mongo, nosql]
    - role: db_clickhouse
      tags: [clickhouse, olap]
    - role: db_redpanda
      tags: [redpanda, kafka]
    - role: db_rabbitmq
      tags: [rabbitmq, queues]
    - role: db_standalone
      tags: [standalone, qdrant, meilisearch, nats, pocketbase, garage]
    - role: db_web_clients
      tags: [web_clients, cloudbeaver]
