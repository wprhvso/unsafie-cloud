---
- name: template garage backup runner script
  ansible.builtin.template:
    src: garage-backup-s3.j2
    dest: /usr/local/bin/garage-backup-s3
    owner: root
    group: root
    mode: "0755"

- name: template garage backup systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - garage-backup.service
    - garage-backup.timer

- name: enable and start garage backup timer
  ansible.builtin.systemd:
    name: garage-backup.timer
    enabled: true
    state: started
    daemon_reload: true
