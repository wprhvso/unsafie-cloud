---
- name: ensure java is installed for cloudbeaver
  ansible.builtin.apt:
    name: default-jre-headless
    state: present

- name: create cloudbeaver directory
  ansible.builtin.file:
    path: /opt/cloudbeaver
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: download and extract cloudbeaver
  ansible.builtin.unarchive:
    src: "https://github.com/dbeaver/cloudbeaver/releases/download/{{ cloudbeaver_version }}/cloudbeaver-ce-{{ cloudbeaver_version }}-linux.gtk.x86_64.tar.gz"
    dest: /opt
    remote_src: true
    creates: /opt/cloudbeaver/run-server.sh

- name: template cloudbeaver service unit
  ansible.builtin.template:
    src: cloudbeaver.service.j2
    dest: /etc/systemd/system/cloudbeaver.service
    owner: root
    group: root
    mode: "0644"

- name: enable and start cloudbeaver
  ansible.builtin.systemd:
    name: cloudbeaver
    state: started
    enabled: true
    daemon_reload: true
