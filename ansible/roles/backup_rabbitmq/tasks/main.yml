---
- name: template rabbitmq backup runner script
  ansible.builtin.template:
    src: rabbitmq-backup-s3.j2
    dest: /usr/local/bin/rabbitmq-backup-s3
    owner: root
    group: root
    mode: "0755"

- name: template rabbitmq backup systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - rabbitmq-backup.service
    - rabbitmq-backup.timer

- name: enable and start rabbitmq backup timer
  ansible.builtin.systemd:
    name: rabbitmq-backup.timer
    enabled: true
    state: started
    daemon_reload: true
