---
- name: add rabbitmq signing keys
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/etc/apt/keyrings/{{ item.name }}"
    mode: "0644"
  loop:
    - { name: "rabbitmq-erlang.gpg", url: "https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-erlang.gpg" }
    - { name: "rabbitmq-server.gpg", url: "https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-server.gpg" }

- name: add erlang apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/rabbitmq-erlang.gpg]
      https://ppa1.novemberain.com/rabbitmq/rabbitmq-erlang/deb/ubuntu
      {{ ansible_distribution_release }} main
    state: present
    filename: rabbitmq-erlang

- name: add rabbitmq apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/rabbitmq-server.gpg]
      https://ppa1.novemberain.com/rabbitmq/rabbitmq-server/deb/ubuntu
      {{ ansible_distribution_release }} main
    state: present
    filename: rabbitmq-server

- name: install rabbitmq server
  ansible.builtin.apt:
    name:
      - erlang-base
      - rabbitmq-server
    state: present
    update_cache: true

- name: enable rabbitmq management plugin
  ansible.builtin.command:
    cmd: rabbitmq-plugins enable rabbitmq_management
  changed_when: false

- name: enable and start rabbitmq service
  ansible.builtin.systemd:
    name: rabbitmq-server
    state: started
    enabled: true
