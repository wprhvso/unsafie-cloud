---
- name: create victoria cache directory
  ansible.builtin.file:
    path: /var/cache/victoria
    state: directory
    mode: "0755"

- name: download victoriametrics
  ansible.builtin.get_url:
    url: "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v{{ victoriametrics_version }}/victoria-metrics-linux-amd64-v{{ victoriametrics_version }}.tar.gz"
    dest: "/var/cache/victoria/victoria-metrics-v{{ victoriametrics_version }}.tar.gz"
    mode: "0644"

- name: unarchive victoriametrics
  ansible.builtin.unarchive:
    src: "/var/cache/victoria/victoria-metrics-v{{ victoriametrics_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    creates: /usr/local/bin/victoria-metrics-prod

- name: link victoriametrics binary
  ansible.builtin.file:
    src: /usr/local/bin/victoria-metrics-prod
    dest: /usr/local/bin/victoria-metrics
    state: link

- name: create victoriametrics directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /var/lib/victoria-metrics
    - /etc/victoria-metrics

- name: template victoriametrics scrape config
  ansible.builtin.template:
    src: scrape.yml.j2
    dest: /etc/victoria-metrics/scrape.yml
    mode: "0644"
  notify: restart victoriametrics

- name: template victoriametrics service unit
  ansible.builtin.template:
    src: victoria-metrics.service.j2
    dest: /etc/systemd/system/victoria-metrics.service
    mode: "0644"
  notify: restart victoriametrics

- name: download victorialogs
  ansible.builtin.get_url:
    url: "https://github.com/VictoriaMetrics/VictoriaLogs/releases/download/v{{ victorialogs_version }}/victoria-logs-linux-amd64-v{{ victorialogs_version }}.tar.gz"
    dest: "/var/cache/victoria/victoria-logs-v{{ victorialogs_version }}.tar.gz"
    mode: "0644"

- name: unarchive victorialogs
  ansible.builtin.unarchive:
    src: "/var/cache/victoria/victoria-logs-v{{ victorialogs_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    creates: /usr/local/bin/victoria-logs-prod

- name: link victorialogs binary
  ansible.builtin.file:
    src: /usr/local/bin/victoria-logs-prod
    dest: /usr/local/bin/victoria-logs
    state: link

- name: create victorialogs directory
  ansible.builtin.file:
    path: /var/lib/victoria-logs
    state: directory
    mode: "0755"

- name: template victorialogs service unit
  ansible.builtin.template:
    src: victoria-logs.service.j2
    dest: /etc/systemd/system/victoria-logs.service
    mode: "0644"
  notify: restart victorialogs

- name: add grafana gpg key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: add grafana apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    state: present
    filename: grafana

- name: install grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true

- name: template grafana datasources
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: /etc/grafana/provisioning/datasources/datasources.yml
    mode: "0644"
  notify: restart grafana

- name: template grafana dashboard provider
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: /etc/grafana/provisioning/dashboards/dashboards.yml
    mode: "0644"
  notify: restart grafana

- name: create grafana boards directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: copy production grafana dashboards
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/lib/grafana/dashboards/{{ item | basename }}"
    owner: grafana
    group: grafana
    mode: "0644"
  with_fileglob:
    - "files/boards/*.json"
  notify: restart grafana

- name: enable observability services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - victoria-metrics
    - victoria-logs
    - grafana-server
