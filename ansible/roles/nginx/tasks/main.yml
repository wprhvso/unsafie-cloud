---
- name: install nginx
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: true

- name: template nginx reverse proxy configuration
  ansible.builtin.template:
    src: platform-vhosts.conf.j2
    dest: /etc/nginx/sites-available/platform-vhosts.conf
    mode: "0644"
  notify: reload nginx

- name: enable platform vhosts
  ansible.builtin.file:
    src: /etc/nginx/sites-available/platform-vhosts.conf
    dest: /etc/nginx/sites-enabled/platform-vhosts.conf
    state: link
  notify: reload nginx

- name: remove default nginx vhost
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
