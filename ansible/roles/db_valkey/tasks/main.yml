---
- name: download valkey gpg key
  ansible.builtin.get_url:
    url: https://packages.valkey.io/gpg
    dest: /tmp/valkey.gpg.asc
    mode: "0644"

- name: dearmor valkey gpg key
  ansible.builtin.command:
    cmd: gpg --dearmor -o /etc/apt/keyrings/valkey.gpg /tmp/valkey.gpg.asc
    creates: /etc/apt/keyrings/valkey.gpg

- name: add valkey apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/valkey.gpg]
      https://packages.valkey.io/deb
      {{ ansible_distribution_release }} main
    state: present
    filename: valkey

- name: install valkey and sentinel
  ansible.builtin.apt:
    name:
      - valkey-server
      - valkey-sentinel
    state: present
    update_cache: true

- name: configure valkey bind addresses
  ansible.builtin.lineinfile:
    path: /etc/valkey/valkey.conf
    regexp: "^bind "
    line: "bind {{ valkey_bind }}"
  notify: restart valkey

- name: enable and start valkey service
  ansible.builtin.systemd:
    name: valkey-server
    state: started
    enabled: true
