---
- name: template platform database backup script
  ansible.builtin.template:
    src: platform-db-backup-s3.j2
    dest: /usr/local/bin/platform-db-backup-s3
    owner: root
    group: root
    mode: "0755"

- name: template platform database backup systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - platform-db-backup.service
    - platform-db-backup.timer

- name: enable and start platform database backup timer
  ansible.builtin.systemd:
    name: platform-db-backup.timer
    enabled: true
    state: started
    daemon_reload: true
