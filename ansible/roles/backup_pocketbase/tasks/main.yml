---
- name: template pocketbase backup runner script
  ansible.builtin.template:
    src: pocketbase-backup-s3.j2
    dest: /usr/local/bin/pocketbase-backup-s3
    owner: root
    group: root
    mode: "0755"

- name: template pocketbase backup systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - pocketbase-backup.service
    - pocketbase-backup.timer

- name: enable and start pocketbase backup timer
  ansible.builtin.systemd:
    name: pocketbase-backup.timer
    enabled: true
    state: started
    daemon_reload: true
