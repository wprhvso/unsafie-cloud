---
- name: install hypervisor prerequisites
  ansible.builtin.apt:
    name:
      - qemu-kvm
      - qemu-utils
      - libvirt-daemon-system
      - bridge-utils
      - iptables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: enable ip forwarding
  ansible.builtin.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true
