---
- name: template meilisearch backup runner script
  ansible.builtin.template:
    src: meilisearch-backup-s3.j2
    dest: /usr/local/bin/meilisearch-backup-s3
    owner: root
    group: root
    mode: "0755"

- name: template meilisearch backup systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - meilisearch-backup.service
    - meilisearch-backup.timer

- name: enable and start meilisearch backup timer
  ansible.builtin.systemd:
    name: meilisearch-backup.timer
    enabled: true
    state: started
    daemon_reload: true
