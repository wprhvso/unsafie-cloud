---
- name: add postgresql gpg key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/postgresql.asc
    mode: "0644"

- name: add postgresql apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/postgresql.asc]
      https://apt.postgresql.org/pub/repos/apt
      {{ ansible_distribution_release }}-pgdg main
    state: present
    filename: postgresql

- name: install postgresql and extensions
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-contrib-{{ postgres_version }}"
      - "postgresql-{{ postgres_version }}-pgvector"
      - "postgresql-{{ postgres_version }}-postgis-3"
    state: present
    update_cache: true

- name: configure postgresql listen addresses
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '{{ postgres_listen_addresses }}'"
  notify: restart postgresql

- name: allow connections from awg subnet in pg_hba
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
    line: "host all all {{ awg_subnet }} scram-sha-256"
  notify: restart postgresql

- name: enable and start postgresql service
  ansible.builtin.systemd:
    name: "postgresql@{{ postgres_version }}-main"
    state: started
    enabled: true
