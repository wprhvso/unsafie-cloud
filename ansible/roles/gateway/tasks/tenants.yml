---
- name: ensure tenant gateway manifests applied
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: tenants-gateway
        namespace: {{ gateway_namespace }}
      spec:
        gatewayClassName: {{ gateway_class }}
        listeners:
          - name: http
            protocol: HTTP
            port: 80
  changed_when: false
  when: inventory_hostname == groups['k3s_servers'][0]
