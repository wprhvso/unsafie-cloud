---
- name: ensure tenant namespace exists
  ansible.builtin.command:
    cmd: kubectl create namespace {{ tenant_namespace }} --dry-run=client -o yaml
  register: tenant_ns_manifest
  changed_when: false
  when: inventory_hostname == groups['k3s_servers'][0]

- name: apply tenant namespace
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ tenant_ns_manifest.stdout }}"
  changed_when: false
  when: inventory_hostname == groups['k3s_servers'][0]

- name: apply tenant resource quota
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: |
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: compute-quota
        namespace: {{ tenant_namespace }}
      spec:
        hard:
          requests.cpu: "{{ sizes.cpu | default('2') }}"
          limits.cpu: "{{ sizes.cpu | default('2') }}"
          requests.memory: "{{ sizes.memory | default('4Gi') }}"
          limits.memory: "{{ sizes.memory | default('4Gi') }}"
          requests.storage: "{{ sizes.storage | default('20Gi') }}"
  changed_when: false
  when: inventory_hostname == groups['k3s_servers'][0]

- name: deploy vcluster if kind is vc
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install {{ tenant }} vcluster
      --repo https://charts.loft.sh
      --namespace {{ tenant_namespace }}
      --create-namespace
  when:
    - inventory_hostname == groups['k3s_servers'][0]
    - tenant_kind | default('ns') == 'vc'
  changed_when: false
