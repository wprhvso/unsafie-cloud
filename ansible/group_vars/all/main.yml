---
awg_iface: awg0
awg_subnet: 10.42.0.0/24
awg_port: 39847
awg_mtu: 1420

awg_obfuscation:
  jc: 4
  jmin: 40
  jmax: 70
  s1: 68
  s2: 149
  h1: 1374849302
  h2: 2148573910
  h3: 3092847561
  h4: 4183726094

sysctl_params:
  net.core.default_qdisc: fq
  net.ipv4.tcp_congestion_control: bbr
  net.ipv4.tcp_fin_timeout: 15
  net.ipv4.tcp_keepalive_time: 300
  net.ipv4.tcp_keepalive_intvl: 15
  net.ipv4.tcp_keepalive_probes: 5
  net.ipv4.tcp_tw_reuse: 1
  net.ipv4.tcp_slow_start_after_idle: 0
  net.ipv4.tcp_mtu_probing: 1
  net.netfilter.nf_conntrack_tcp_timeout_established: 86400
  vm.swappiness: 10
  vm.overcommit_memory: 1
  kernel.kptr_restrict: 2
  kernel.dmesg_restrict: 1

base_packages:
  - curl
  - htop
  - git
  - jq
  - tmux
  - tar
  - unzip
  - ca-certificates
  - gnupg
  - lsb-release
  - rsync

journald_max_use: 2G

backup_s3_endpoint: "https://{{ cloudflare_account_id | default('r2-account-placeholder') }}.r2.cloudflarestorage.com"
backup_s3_region: "auto"
backup_s3_bucket: "infra-r2-backups"
backup_r2_bucket: "infra-r2-backups"
backup_retention_days: 14
backup_config_dir: "/etc/infra-backup"
backup_textfile_dir: "/var/lib/node_exporter/textfile_collector"
backup_log_dir: "/var/log/infra-backup"

backup_prefixes:
  postgres: "postgres"
  clickhouse: "clickhouse"
  mongo: "mongo"
  valkey: "valkey"
  redpanda: "redpanda"
  rabbitmq: "rabbitmq"
  qdrant: "qdrant"
  meilisearch: "meilisearch"
  nats: "nats"
  pocketbase: "pocketbase"
  garage: "garage"
  k3s: "k3s-etcd"
  platform_db: "platform-db"
