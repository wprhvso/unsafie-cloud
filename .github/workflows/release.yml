name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup zig
        run: |
          curl -fsSL https://ziglang.org/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz | sudo tar -xJ -C /opt
          echo "/opt/zig-x86_64-linux-0.15.1" >> "$GITHUB_PATH"

      - uses: extractions/setup-just@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: run release build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just cd-all
