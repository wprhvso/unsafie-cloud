[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unsafie-cloud"
version = "0.1.0"
description = "Official Python async SDK for Unsafie Cloud IaaS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["unsafie_cloud"]

[tool.ruff]
line-length = 100
target-version = "py311"
