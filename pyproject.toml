[project]
name = "infrastructure"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
  "packages/*",
  "services/*",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pyright]
include = ["packages", "services"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
